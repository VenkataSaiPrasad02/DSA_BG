
server:
  port: ${SERVER_PORT:8081}

app:
  message: "Auth Service configuration loaded"

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dsabg_auth}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
