
server:
  port: 8081

app:
  message: "Auth Service configuration loaded"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dsabg_auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
