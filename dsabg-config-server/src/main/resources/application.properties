spring.application.name=dsabg-config-server
server.port=8888

spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:https://github.com/VenkataSaiPrasad02/dsabg-config.git}
spring.cloud.config.server.git.default-label=${CONFIG_REPO_BRANCH:main}
spring.cloud.config.server.git.username=${CONFIG_REPO_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_REPO_PASSWORD:}

# Eureka Server address
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Customize the instance identity
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true