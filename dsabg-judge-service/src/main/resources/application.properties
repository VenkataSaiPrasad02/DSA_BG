spring.application.name=dsabg-judge-service
server.port=8087

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/dsabg_judge_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Config Server
spring.config.import=configserver:http://localhost:8888

# Judge0 Configuration
judge0.base-url=http://10.0.2.2:2358
judge0.api-key=${JUDGE0_API_KEY:}

# Logging
logging.level.com.dsabg.judgeservice=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

