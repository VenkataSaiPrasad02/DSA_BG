spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: dsabg-profile-service
              uri: http://localhost:8082
              predicates:
                - Path=/profile/**

            - id: dsabg-friends-service
              uri: http://localhost:8083
              predicates:
                - Path=/friend/**
              filters:
                - SensitiveHeaders=Cookie,Set-Cookie

            - id: dsabg-custom-room-service
              uri: http://localhost:8084
              predicates:
                - Path=/room/**

            - id: dsabg-problem-service
              uri: http://localhost:8085
              predicates:
                - Path=/problem/**

            - id: dsabg-battle-service
              uri: http://localhost:8086
              predicates:
                - Path=/battle/**

            - id: dsabg-custom-room-websocket
              uri: ws://localhost:8084
              predicates:
                - Path=/ws,/ws/**

            - id: dsabg-judge-service
              uri: http://localhost:8087
              predicates:
                - Path=/judge/**
